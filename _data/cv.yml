- title: Experience
  type: time_table
  contents:

    - title: Staff Engineer/Team Lead, Energy Management
      institution: Zoox
      year: 2025 - Present
      location: Foster City, CA
      description:
        - Vehicle energy management and optimization
        - Fleet charging algorithm development
        - Multi-disciplinary design and analysis for concept vehicle design and charging systems deployment
       
    - title: Principal Engineer, Electrification
      institution: Amazon – Last Mile Global Fleet and Products
      year: 2022 - 2025
      location: Seattle, WA
      description:
        - Principal Systems Engineer leading a research science group responsible for architectural decisions in the electrification of Amazon's Last Mile delivery network.
        - Developed mathematical models to simulate fleet charging operations and optimize charging hardware and control strategies to minimize CapEx and charging electricity costs.
        - Led the introduction of battery life modeling into EV deployment simulation infrastructure, enabling trade studies between charge rates and battery size with respect to fleet lifetime and expected CapEx.

    - title: Manager, Battery Systems Engineering
      institution: Amazon – Last Mile Global Fleet and Products
      year: 2020 - 2022
      location: Seattle, WA
      description:
        - Senior Engineer/Manager responsible for energy systems requirements on pilot electric vehicles (EVs) and the Rivian Electric Delivery Vehicle (EDV).
        - Worked with Rivian to design, simulate, and develop a next generation energy storage system (ESS) for the EDV, reducing cost while meeting Amazon energy requirements.
        - Developed physics-based models for delivery route energy estimation, achieving a MAPE of 13% across 3 vehicle variants without machine learning techniques. Models used by internal partner teams to plan EV deployments 3 years out.

    - title: Manager, Fuels and Energy Conversion
      institution: Amazon – Prime Air
      year: 2019 - 2020
      location: Seattle, WA
      description:
        - Hired and developed a team of 8 hardware and software engineers responsible for all on-vehicle energy storage and conversion systems, along with on-ground charging hardware.
        - Led design, build, and validation activities for 3 generations of Prime Air vehicle ESS across multiple Li-ion cell formats (pouch, cylindrical). Achieved pack level energy density of 185 Wh/kg while meeting 4C continuous / 8C peak discharge rates with passive cooling.
        - Scaled battery pack production to hundreds of units per year with a 3rd party contract manufacturer.
        - Designed and delivered 65 bespoke charging systems for the ESS, capable of remote deployment to drone test ranges.

    - title: Sr. Battery Systems Engineer
      institution: Amazon – Prime Air
      year: 2016 - 2019
      location: Seattle, WA
      description:
        - First battery engineer hire on the team; led definition and requirements development for Prime Air's first bespoke battery system and initial in-house pack assembly.
        - Defined and procured cell and pack test equipment for Li-ion battery testing (36 cell channels / 16 pack channels).
        - Developed 2 RC pair electro-thermal battery models for use in Prime Air's MDAO aircraft design tool.
        - Incubated business relationships with multiple Tier 1 battery cell OEMs for cell sourcing, evaluation, and LRIP.

    - title: Cell and Module Engineer, R&D
      institution: AllCell Technologies
      year: 2012 - 2015
      location: Chicago, IL
      description:
        - Responsible for Li-ion cell and module electrical and thermal testing/characterization.
        - Developed cell and module electrochemical models, including equivalent circuit and single particle physics approaches.
        - Designed and executed thermal runaway tests across cell, module, and pack levels.
        - Investigated the efficacy of multiple types of phase change composite materials on thermal runaway propagation.
        - Developed long term cell aging models consuming customer usage profiles and predicting capacity loss and resistance growth over time and energy throughput.
        - Lead engineer for a clad metal current collector development program; reduced current collector ohmic losses by 65% in stationary energy storage product.

    - title: Test Engineer, Global Battery Systems Lab
      institution: General Motors
      year: 2011 - 2012
      location: Warren, MI
      description:
        - Responsible for Volt Gen 2 cell and pack test setup and execution activities.

